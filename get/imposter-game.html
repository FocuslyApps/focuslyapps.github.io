<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Imposter</title>
  <!--
    Smart redirect page for QR codes / shared links. NO backend required.
    Host this on GitHub Pages (e.g. focuslyapps.github.io/get) and point the
    in-app QR code at that URL. It detects the visitor's OS and forwards them
    to the correct store, so one QR works for both iPhone and Android.
  -->
  <link rel="icon" href="data:," />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    } 

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090b;
      background: radial-gradient(circle at top, #1e1333 0%, #09090b 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      max-width: 400px;
      width: 100%;
      background: #141417;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 40px 24px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(142, 45, 226, 0.1);
    }

    .app-icon {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      margin: 0 auto 20px;
      display: block;
      box-shadow: 0 10px 28px rgba(142, 45, 226, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      object-fit: cover;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.3px;
    }

    p {
      opacity: .8;
      margin: 0 0 28px;
      line-height: 1.5;
      font-size: 15px;
      color: #d4d4d8;
    }

    .store-btn {
      display: block;
      margin: 14px auto;
      max-width: 250px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: #000;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }

    .store-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 25px rgba(142, 45, 226, 0.25);
    }

    .store-btn img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 60px;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="../assets/find-the-imposter-logo.png" alt="Find Who's Different Logo" class="app-icon" />
    <h1>🤫 Get Imposter Game</h1>
    <p>Redirecting you to your app store…<br />If nothing happens, pick your store below.</p>
    <a href="https://apps.apple.com/app/id6757858367" target="_blank" class="store-btn">
      <img src="../assets/appstore.svg" alt="Imposter: Download on the App Store">
    </a>
    <a href="https://play.google.com/store/apps/details?id=com.productivitypulse.findwhosdifferent" target="_blank"
      class="store-btn">
      <img src="../assets/playstore.svg" alt="Imposter: Get it on Google Play">
    </a>
  </div>

  <script>
    (function () {
      var APP_STORE = "https://apps.apple.com/app/id6757858367";
      var PLAY_STORE = "https://play.google.com/store/apps/details?id=com.productivitypulse.findwhosdifferent";
      var ua = navigator.userAgent || navigator.vendor || "";

      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS
      var isAndroid = /android/i.test(ua);

      if (isIOS) {
        window.location.replace(APP_STORE);
      } else if (isAndroid) {
        window.location.replace(PLAY_STORE);
      }
      // Desktop / unknown: stay on the page so they can choose a button.
    })();
  </script>
</body>

</html>
